name: Android CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'mobile/android/**'
      - '.github/workflows/android.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'mobile/android/**'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  android-build:
    name: Build Android Application
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      
      - name: Grant execute permission for gradlew
        working-directory: mobile/android
        run: chmod +x gradlew || echo "gradlew not found, skipping"
      
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      
      - name: Build debug APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug --stacktrace || echo "Build requires full Android SDK setup"
      
      - name: Run unit tests
        working-directory: mobile/android
        run: ./gradlew test --stacktrace || echo "Tests require full Android SDK setup"
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: android-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/*.apk
