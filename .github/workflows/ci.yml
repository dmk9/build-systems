name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-build:
    name: Build Web Application
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      
      - name: Install dependencies
        working-directory: web
        run: npm ci
      
      - name: Lint code
        working-directory: web
        run: npm run lint
      
      - name: Build application
        working-directory: web
        run: npm run build
      
      - name: Verify build artifacts
        working-directory: web
        run: |
          echo "Checking for web build artifacts..."
          ls -la dist/ || echo "Warning: dist/ directory not found"
      
      - name: Run tests
        working-directory: web
        run: npm test || echo "No tests configured yet"
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: web/dist/

  native-build:
    name: Build Native Library
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake g++ ccache
      
      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-ccache-${{ hashFiles('native/**') }}
          restore-keys: |
            ${{ runner.os }}-ccache-
      
      - name: Configure CMake
        working-directory: native
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      
      - name: Build library
        working-directory: native
        run: cmake --build build -- -j$(nproc)
      
      - name: Run tests
        working-directory: native/build
        run: ctest --output-on-failure
      
      - name: Verify artifacts exist
        working-directory: native/build
        run: |
          echo "Checking for build artifacts..."
          ls -la demo || echo "Warning: demo executable not found"
          ls -la libBuildSystemsNative.a || echo "Warning: library not found"
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: native-build
          path: native/build/demo

  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [web-build, native-build]
    permissions:
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: false
          tags: build-systems:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install dependencies
        working-directory: web
        run: npm ci
      
      - name: Run npm audit
        working-directory: web
        run: npm audit --audit-level=high || true
      
      - name: Run security check with npm
        working-directory: web
        run: npm audit --production || echo "Security issues found - review required"

